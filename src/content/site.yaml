# Site settings. Changes need review from the site owner.

# Permanent CPL Discord invite: the "Join Discord" button on every page.
discordInvite: https://discord.gg/cpl

# Which games and sections are built. Anything switched off has no page and no menu item.
# intro: a line or two at the top of the game's page (up to 240 characters).
games:
  civ6:
    intro: "Ranked Civ 6 at CPL: FFA, Teamer and Duel games every season, cloud games all year round, and tournaments like the Premier League."
    show: true
    ladder: true
    stats: true
    tournaments: true
  civ7:
    intro: "Ranked Civ 7 at CPL: FFA, Teamer and Duel games every season, with their own ladders and stats."
    show: false
    ladder: false
    stats: false
    tournaments: false

