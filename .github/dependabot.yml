version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:17'
      timezone: Europe/London
    versioning-strategy: increase
    ignore:
      # Types must match the Node 24 runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # @astrojs/check supports TypeScript ^5 || ^6.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:17'
      timezone: Europe/London
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)