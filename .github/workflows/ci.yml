name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm

      - name: Install
        run: npm ci

      # No secrets here: ladder and stats pages are built from made-up test data, so the checks cover them.
      - name: Verify
        run: npm run verify
        env:
          CORE_API_FIXTURES: tests/fixtures/core-api

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://cpl.elementalengine.net/
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm

      - name: Install
        run: npm ci

      # Only this job can read secrets, so it builds the pages with live standings, ladders and stats.
      - name: Build with live data
        run: npm run build
        env:
          CHALLONGE_API_KEY: ${{ secrets.CHALLONGE_API_KEY }}
          CORE_API_WEBSITE_TOKEN: ${{ secrets.CORE_API_WEBSITE_TOKEN }}

      - name: Accessibility check
        run: npm run a11y

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # The site went out with the last good data, but a wrong token, route or answer needs a fix:
      # fail the run so Healthchecks alerts.
      - name: Check core-api problems
        run: |
          if [ -s core-api-problems.txt ]; then
            cat core-api-problems.txt
            exit 1
          fi

      - name: Ping Healthchecks (success)
        run: curl -fsS -m 10 --retry 5 -o /dev/null "$PING_URL"
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}

      - name: Ping Healthchecks (fail)
        if: failure()
        run: curl -fsS -m 10 --retry 5 -o /dev/null "$PING_URL/fail"
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}

  report-failure:
    needs: verify
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Ping Healthchecks (fail)
        run: curl -fsS -m 10 --retry 5 -o /dev/null "$PING_URL/fail"
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
